name: ci
on: { pull_request: {}, push: { branches: [main] }, workflow_dispatch: {} }
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The checks run inside .github/ci/Dockerfile. The layers are saved to the Actions cache (one
  # scope per job).
  # A PR needs only `test`; arm64, parity and miri run on main and on workflow_dispatch. The
  # arm64 jobs run on native aarch64 runners.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: ci
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=zstd-rs-test
          # Only main and dispatch runs export: a PR's cache is scoped to its ref, so no other PR
          # could read it, and the export takes about two minutes.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=zstd-rs-test' || '' }}

  arm64:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: arm64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=zstd-rs-arm64
          cache-to: type=gha,mode=max,scope=zstd-rs-arm64

  parity:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: parity
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=zstd-rs-parity
          cache-to: type=gha,mode=max,scope=zstd-rs-parity

  parity-arm64:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: parity-arm64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=zstd-rs-parity-arm64
          cache-to: type=gha,mode=max,scope=zstd-rs-parity-arm64

  miri:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: miri
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=zstd-rs-miri
          cache-to: type=gha,mode=max,scope=zstd-rs-miri
