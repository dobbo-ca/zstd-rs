name: fuzz
on:
  schedule: [{ cron: '23 6 * * 4' }]
  workflow_dispatch:
    inputs:
      max_total_time:
        description: Seconds per target
        default: '600'
permissions:
  contents: read
# A new run waits for the one before it; it does not cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fuzz:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: decode, seeds: 'tests/fuzz/seeds tests/data/golden tests/data/golden-errors tests/data/klauspost/good tests/data/klauspost/bad tests/data/decodecorpus tests/data/tiles' }
          - { target: limits, seeds: 'tests/fuzz/seeds-limits' }
          - { target: content_size, seeds: 'tests/fuzz/seeds tests/data/golden tests/data/golden-errors tests/data/decodecorpus tests/data/tiles' }
          - { target: czi, seeds: 'tests/fuzz/seeds-czi', max_len: '131086', len_control: '0' }
          - { target: interleave, seeds: 'tests/fuzz/seeds' }
          - { target: huf, seeds: 'tests/fuzz/seeds-huf' }
          - { target: seqloop, seeds: 'tests/fuzz/seeds tests/data/golden tests/data/tiles tests/data/decodecorpus' }
          - { target: frames, seeds: 'tests/fuzz/seeds tests/data/golden tests/data/tiles' }
    timeout-minutes: 60
    env:
      MAX_TOTAL_TIME: ${{ inputs.max_total_time || '600' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: fuzz
          load: true
          push: false
          tags: zstd-fuzz:local
          cache-from: type=gha,scope=zstd-rs-fuzz
          cache-to: type=gha,mode=max,scope=zstd-rs-fuzz
      # The corpus found so far, kept between runs (by target, newest run first).
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: corpus-cache/${{ matrix.target }}
          key: corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: corpus-${{ matrix.target }}-
      # docker run, not a RUN layer: a BuildKit cache hit would skip the fuzzing. Seeds: the
      # zstd-go FuzzDecodeAll entries (tests/fuzz/seeds) and the golden and conformance frames; new
      # inputs go to the first corpus dir. An allocation past the limits is a crash.
      - run: >
          mkdir -p corpus-cache/${{ matrix.target }} &&
          docker run --name fuzz -v "$PWD/corpus-cache:/cache" -e MAX_TOTAL_TIME -e TARGET=${{ matrix.target }} zstd-fuzz:local
          sh -c 'mkdir -p tests/fuzz/corpus/$TARGET /cache/$TARGET && cp -r /cache/$TARGET/. tests/fuzz/corpus/$TARGET/ &&
          cargo +nightly fuzz run --fuzz-dir tests/fuzz $TARGET
          tests/fuzz/corpus/$TARGET ${{ matrix.seeds }} --
          -max_total_time=$MAX_TOTAL_TIME -timeout=20 -rss_limit_mb=2048 -malloc_limit_mb=512 ${{ matrix.max_len && format('-max_len={0}', matrix.max_len) || '' }} ${{ matrix.len_control && format('-len_control={0}', matrix.len_control) || '' }};
          s=$?; cp -r tests/fuzz/corpus/$TARGET/. /cache/$TARGET/; exit $s'
      - if: failure()
        run: docker cp fuzz:/src/tests/fuzz/artifacts/${{ matrix.target }} ./crashers
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crashers-${{ matrix.target }}
          path: crashers

  # The kernels that differ on aarch64: the NEON interleave and the plain sequence loop, fuzzed on a
  # native aarch64 runner.
  fuzz-arm64:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: interleave, seeds: 'tests/fuzz/seeds' }
          - { target: seqloop, seeds: 'tests/fuzz/seeds tests/data/golden tests/data/tiles tests/data/decodecorpus' }
    timeout-minutes: 60
    env:
      MAX_TOTAL_TIME: ${{ inputs.max_total_time || '600' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: fuzz
          load: true
          push: false
          tags: zstd-fuzz:local
          cache-from: type=gha,scope=zstd-rs-fuzz-arm64
          cache-to: type=gha,mode=max,scope=zstd-rs-fuzz-arm64
      # The corpus found so far, kept between runs (by target, newest run first).
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: corpus-cache/${{ matrix.target }}
          key: corpus-arm64-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: corpus-arm64-${{ matrix.target }}-
      - run: >
          mkdir -p corpus-cache/${{ matrix.target }} &&
          docker run --name fuzz -v "$PWD/corpus-cache:/cache" -e MAX_TOTAL_TIME -e TARGET=${{ matrix.target }} zstd-fuzz:local
          sh -c 'mkdir -p tests/fuzz/corpus/$TARGET /cache/$TARGET && cp -r /cache/$TARGET/. tests/fuzz/corpus/$TARGET/ &&
          cargo +nightly fuzz run --fuzz-dir tests/fuzz $TARGET
          tests/fuzz/corpus/$TARGET ${{ matrix.seeds }} --
          -max_total_time=$MAX_TOTAL_TIME -timeout=20 -rss_limit_mb=2048 -malloc_limit_mb=512;
          s=$?; cp -r tests/fuzz/corpus/$TARGET/. /cache/$TARGET/; exit $s'
      - if: failure()
        run: docker cp fuzz:/src/tests/fuzz/artifacts/${{ matrix.target }} ./crashers
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crashers-${{ matrix.target }}-arm64
          path: crashers
