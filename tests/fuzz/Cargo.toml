test = false
doc = false
bench = false

[[bin]]
name = "interleave"
path = "fuzz_targets/interleave.rs"
test = false
doc = false
bench = false

[[bin]]
name = "seqloop"
path = "fuzz_targets/seqloop.rs"
test = false
